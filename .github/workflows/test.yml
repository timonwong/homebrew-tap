name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@962acc985cf741e4f7a112a3cfa6194386b63edf
      - name: Audit formula
        run: brew audit --strict --online timonwong/tap/jiro
      - name: Install and test formula
        run: |
          brew install timonwong/tap/jiro
          brew test timonwong/tap/jiro
