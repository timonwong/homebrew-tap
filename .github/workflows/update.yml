name: Update formulae

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  formula:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: jiro
            script: ./scripts/update-jiro
            formula: Formula/jiro.rb
          - name: skimi
            script: ./scripts/update-skimi
            formula: Formula/skimi.rb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Refresh formulae
        run: git pull --ff-only origin main
      - name: Reconcile with the latest stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.script }}
      - name: Commit update
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          file_pattern: ${{ matrix.formula }}
          commit_message: Update ${{ matrix.name }} Formula
          commit_user_name: goreleaserbot
          commit_user_email: bot@goreleaser.com
          commit_author: goreleaserbot <bot@goreleaser.com>
